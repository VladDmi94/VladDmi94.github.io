<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnet Redirect</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<style>
  body {
    background-color: #000;
    color: #ccc;
    font-family: sans-serif;
    text-align: center;
    padding: 20px;
    font-size: clamp(15px, 3.5vw, 18px);
  }
  a { color: #4da3ff; }
  #link {
    word-break: break-all;
    display: block;
    margin-top: 10px;
    font-size: clamp(12px, 3vw, 15px);
  }
  #copy.ok {
    color: #5ddc6a;
    border-color: #5ddc6a;
    background: #5ddc6a1a;
  }
  #copy.fail { color: #f66;
    border-color: #f66;
    background: #f661;
  }
  .btn {
    display: inline-block;
    margin: 12px 6px;
    padding: 10px 18px;
    border: 1px solid #4da3ff;
    border-radius: 8px;
    color: #4da3ff;
    background: none;
    font-size: inherit;
    text-decoration: none;
    cursor: pointer;
  }
  .err { color: #f66; margin-top: 20px; }
</style>
</head>
<body>
<h3>Редирект на</h3>
<a id="link" href="#"></a>
<br>
<button id="copy" class="btn">Скопировать</button>

<script>
function cleanLink(raw) {
  let h;
  try { h = decodeURIComponent(raw); } catch (e) { h = raw.replace(/%+$/, ""); }
  h = h.trim();
  const lastHash = h.lastIndexOf("#");
  if (lastHash !== -1) h = h.slice(lastHash + 1);
  h = h.trim().replace(/^[\s"'(\[>+]+/, "").replace(/[\s)\"\'>]+$/g, "").trim();
  h = h.replace(/[\s.,;:!]+$/g, "").trim();
  if (h.length >= 2 && (h[0] === '"' || h[0] === "'") && h[h.length - 1] === h[0]) {
    h = h.slice(1, -1).trim();
  }
  return h;
}

function getMagnet() {
  const raw = location.hash.slice(1);
  if (!raw) {
    return { error: "Нужно добавить magnet-ссылку или info-hash в конце адреса: https://vladdmi94.github.io/magnet-redirect.html#…" };
  }
  let h = cleanLink(raw);
  if (!h.startsWith("magnet:")) {
    if (!/^[a-f0-9]{40}$/i.test(h)) {
      return { error: "Похоже, это не magnet-ссылка и не info-hash (нужны 40 символов a–f, 0–9)." };
    }
    h = "magnet:?xt=urn:btih:" + h;
  }
  return { magnet: h };
}

function redirect() {
  const r = getMagnet();
  if (r.error) {
    document.body.innerHTML = '<p class="err">' + r.error + "</p>";
    return;
  }
  const link = document.getElementById("link");
  const copy = document.getElementById("copy");
  link.textContent = r.magnet;
  link.href = r.magnet;
  copy.onclick = () => {
    navigator.clipboard.writeText(r.magnet).then(
      () => {
        copy.textContent = "Скопировано";
        copy.classList.add("ok");
        setTimeout(() => { copy.textContent = "Скопировать"; copy.classList.remove("ok"); }, 1500);
      },
      () => {
        copy.textContent = "Не вышло";
        copy.classList.add("fail");
        setTimeout(() => { copy.textContent = "Скопировать"; copy.classList.remove("fail"); }, 1500);
      }
    );
  };
  location.href = r.magnet;
}
window.addEventListener("load", redirect);
window.addEventListener("hashchange", redirect);
</script>
</body>
</html>
