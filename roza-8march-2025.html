<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/roza-favicon.png">
    <title>С 8 марта, Роза!</title>
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vladdmi94.github.io/roza-8march-2025.html">
    <meta property="og:title" content="С 8 марта, Роза!">
    <meta property="og:description" content="🎁">

    <style>
        /* Прелоадер */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease-out;
        }

        /* Кнопка открытия */
        #open-button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #ff4d6d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
        }
        #open-button:hover {
            transform: scale(1.1);
        }

        /* Основные стили */
        body {
            background: linear-gradient(45deg, #ffebf0, #ffb3c6, #ffcce6, #cceeff, #e6ccff, #fff5e6);
            background-size: 300% 300%;
            animation: gradientShift 60s infinite alternate ease-in-out;
            text-align: center;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            margin: 0;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Контейнер */
        .container {
            position: relative;
            margin-top: 50px;
        }

        /* Изображение котика */
        #cat-image {
            display: block;
            width: 90%;
            max-width: 600px;
            height: auto;
            cursor: pointer;
            margin: 10px auto 0;
            opacity: 0;
            transform: scale(0.8);
            visibility: hidden;
        }

        /* Заголовок */
        #header {
            opacity: 0;
            transform: scale(0.8);
            visibility: hidden;
            font-size: 32px;
            color: #d6336c;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Лепестки */
        .petal {
            position: absolute;
            width: 20px;
            height: 14px;
            background: radial-gradient(circle, #ff6b81, #ff4d6d);
            border-radius: 50%;
            opacity: 0.9;
            pointer-events: none;
            top: -15px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            animation: fall 8s ease-in forwards;
        }
        @keyframes fall {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
            90% { transform: translateY(calc(100vh - 5px)) translateX(30px) rotate(240deg); opacity: 1; }
            100% { transform: translateY(calc(100vh - 5px)) translateX(30px) rotate(240deg); opacity: 0; }
        }

        /* Кнопка музыки */
        #play-button {
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #ff4d6d;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
            opacity: 0;
            transform: scale(0.8);
            visibility: hidden;
            width: auto;
            max-width: 100%;
            min-height: 60px;
            box-sizing: border-box;
            white-space: normal;
            line-height: 1.4;
            text-align: center;
        }
        #play-button:hover {
            background-color: #d6336c;
        }

        /* Текст поздравления */
        #greeting {
            font-size: 18px;
            color: #d6336c;
            font-weight: bold;
            max-width: 600px;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
            padding: 10px;
            margin-top: 0px;
            margin-bottom: 0px;
            opacity: 0;
            transform: scale(0.8);
            visibility: hidden;
        }

        /* Подпись */
        #signature {
            font-size: 18px;
            color: #d6336c;
            margin-top: 10px;
            font-weight: bold;
            max-width: 600px;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
            text-align: right;
            opacity: 0;
            transform: scale(0.8);
            visibility: hidden;
        }

        /* Текст "Мяу!" */
        .meow-text {
            position: absolute;
            font-size: 24px;
            color: #ff4d6d;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            opacity: 1;
            animation: fadeOut 1s ease-in-out forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        /* Медиа-запрос для мобильных устройств */
        @media (max-width: 600px) {
            #cat-image {
                width: 80%;
            }
            #header {
                font-size: 24px;
            }
            #greeting {
                font-size: 16px;
                width: 80%;
            }
            #play-button {
                font-size: 14px;
                min-height: 50px;
            }
            #signature {
                font-size: 16px;
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <!-- Прелоадер -->
    <div id="preloader">
        <button id="open-button">🎁</button>
    </div>

    <!-- Основной контент -->
    <div class="container">
        <h1 id="header">С 8 марта, Роза! 🌹</h1>
        <!-- Кнопка теперь выше картинки -->
        <button id="play-button">📖Открыть поздравление и<br>🎶Включить музыку</button>
        <img id="cat-image" src="images/roza-8march-2025-cat-with-rose.png" alt="Котик с розой">
        <br>
        <audio id="bg-music" src="images/roza-8march-2025-piano-music.mp3"></audio>
        <p id="greeting">Дорогая Розачка, поздравляю тебя с Международным женским днём 8 марта!💕 Желаю тебе и всем твоим родным крепкого здоровья, никогда не болеть. Будь самой счастливой и дари счастье остальным. Пусть исполнятся все твои мечты!💖</p>
        <p id="signature">Твой Влад</p>
    </div>

    <script>
        // Константы для элементов
        const elements = {
            preloader: document.getElementById("preloader"),
            openButton: document.getElementById("open-button"),
            header: document.getElementById("header"),
            catImage: document.getElementById("cat-image"),
            playButton: document.getElementById("play-button"),
            greeting: document.getElementById("greeting"),
            signature: document.getElementById("signature"),
            music: document.getElementById("bg-music"),
        };

        // Звуки для котика
        const sounds = ["roza-8march-2025-meow-1.mp3", "roza-8march-2025-meow-2.mp3",
                      "roza-8march-2025-meow-3.mp3", "roza-8march-2025-meow-4.mp3",
                      "roza-8march-2025-meow-5.mp3"];

        // Переменные для управления лепестками
        let petalsInterval;
        let petalCount = 0;
        const maxPetals = 50;

        // Функция для создания лепестка
        function createPetal() {
            if (petalCount >= maxPetals) return;
            petalCount++;

            const petal = document.createElement("div");
            petal.classList.add("petal");
            document.body.appendChild(petal);

            petal.style.left = `${Math.random() * (window.innerWidth - 30)}px`;
            petal.style.animationDuration = `${Math.random() * 4 + 6}s`;

            setTimeout(() => {
                petal.remove();
                petalCount--;
            }, parseFloat(petal.style.animationDuration) * 1000);
        }

        // Обработчик открытия поздравления
        elements.openButton.addEventListener("click", () => {
            elements.preloader.style.opacity = "0";
            setTimeout(() => {
                elements.preloader.style.display = "none";

                // Показываем заголовок через 1.5 секунду
                elements.header.style.visibility = "visible";
                elements.header.style.animation = "fadeIn 1.5s ease-out forwards";

                // Показываем кнопку через 1.5 секунды после заголовка
                setTimeout(() => {
                    elements.playButton.style.visibility = "visible";
                    elements.playButton.style.animation = "fadeIn 1.5s ease-out forwards";
                }, 1500);
            }, 1500);
        });

        // Обработчик музыки
        let isFirstClick = true;
        elements.playButton.addEventListener("click", () => {
            if (elements.music.paused) {
                elements.music.play();
                elements.playButton.innerHTML = "⏸ Остановить музыку";
                petalsInterval = setInterval(createPetal, 500);

                // Показываем картинку сразу
                elements.catImage.style.visibility = "visible";
                elements.catImage.style.animation = "fadeIn 1.5s ease-out forwards";

                // Показываем текст поздравления через 1.5 секунды
                setTimeout(() => {
                    elements.greeting.style.visibility = "visible";
                    elements.greeting.style.animation = "fadeIn 1.5s ease-out forwards";
                }, 1500);

                // Показываем подпись через 5 секунд после текста
                setTimeout(() => {
                    elements.signature.style.visibility = "visible";
                    elements.signature.style.animation = "fadeIn 1.5s ease-out forwards";
                }, 5000);

                if (isFirstClick) {
                    isFirstClick = false;
                }
            } else {
                elements.music.pause();
                elements.playButton.innerHTML = "🎵Вернуть музыку";
            }
        });

        // Громкость музыки
        elements.music.volume = 0.3;

        // Обработчик клика по котику
        elements.catImage.addEventListener("click", (event) => {
            const randomSound = sounds[Math.floor(Math.random() * sounds.length)];
            new Audio(`images/${randomSound}`).play();

            const meowText = document.createElement("div");
            meowText.classList.add("meow-text");
            meowText.textContent = "Мяу!😸";
            document.body.appendChild(meowText);

            // Позиция текста "Мяу!😸"
            meowText.style.left = `${event.pageX - 30}px`;
            meowText.style.top = `${event.pageY - 40}px`;

            // Удаляем элемент после завершения анимации
            meowText.addEventListener("animationend", () => {
                meowText.remove();
            });
        });
    </script>
</body>
</html>
